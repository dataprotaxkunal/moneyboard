name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find index.html
        run: |
          if [ -f Index.html ]; then mv Index.html index.html; fi
          test -f index.html || (echo "Upload your Moneyboard index.html" && exit 1)
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Convert to mobile app and bundle libraries
        run: |
          python3 make_app.py index.html
          rm -rf www && mv moneyboard-app www
          python3 prep_web.py
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Moneyboard-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
